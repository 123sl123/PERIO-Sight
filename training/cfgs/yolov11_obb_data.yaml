# Periodontitis OBB dataset configuration.

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: "/path/to/periodontitis_dataset"  # dataset root dir
train: train/images  # train images (relative to 'path')
val: val/images  # val images (relative to 'path')
test: test/images       # test images (relative to 'path')
periodontitis_real_annotation: periodontitis_real_annotation/images

# Classes (based on the label file analysis)
# Class 0: periodontitis; class 1: target region used for cropping.
names:
  0: periodontitis
  1: target_region

# Number of classes
nc: 2
